name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy app tests
      - name: Test
        run: pytest --cov --cov-report=term
      - name: Test accounts against Postgres
        env:
          TEST_DATABASE_URL: postgresql://postgres:ci-only@localhost:5432/postgres
        run: pytest tests/test_auth.py tests/test_family.py tests/test_database.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t saanssafe:ci .
      - name: Smoke test
        run: |
          docker run -d --name app -p 8080:8080 saanssafe:ci
          for i in $(seq 1 20); do curl -fs localhost:8080/api/health && break; sleep 1; done
          curl -fs "localhost:8080/api/air?lat=28.61&lon=77.21&simulate=true" | grep -q '"value":418'
          curl -fsI localhost:8080/ | grep -qi content-security-policy
          curl -fs localhost:8080/login | grep -q '<div id="root">'
          curl -fs -c jar -H 'Content-Type: application/json' \
            -d '{"name":"CI","email":"ci@example.com","password":"ci-smoke-test-1"}' localhost:8080/api/auth/signup
          echo "accounts writable in the container"
